services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target-cache:/app/target
    working_dir: /app
    # Keep container alive für interaktives Arbeiten
    command: sleep infinity
    environment:
      - CARGO_TERM_COLOR=always

  # One-shot Builder für Releases
  builder:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target-cache:/app/target
    working_dir: /app
    command: cargo build --release

volumes:
  cargo-registry:
  cargo-git:
  target-cache:
