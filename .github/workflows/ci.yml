name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Tests
        run: cargo test --verbose

  build-windows-gnu:
    name: Build Windows EXE (GNU)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      - name: Install mingw + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 clang pkg-config libssl-dev
          sudo ln -sf /usr/bin/x86_64-w64-mingw32-windres /usr/bin/windres
          windres --version
          x86_64-w64-mingw32-gcc --version

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release (Windows GNU)
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Show artifact
        run: |
          ls -lh target/x86_64-pc-windows-gnu/release/gitmanager.exe || ls -lh target/x86_64-pc-windows-gnu/release/
          file target/x86_64-pc-windows-gnu/release/gitmanager.exe || true

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: gitmanager-windows-gnu-${{ github.sha }}
          path: target/x86_64-pc-windows-gnu/release/gitmanager.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload artifact (alias for release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: gitmanager-${{ github.ref_name }}-windows-gnu
          path: target/x86_64-pc-windows-gnu/release/gitmanager.exe
          retention-days: 90

  release:
    name: Publish to GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows-gnu
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download EXE artifact
        uses: actions/download-artifact@v8
        with:
          name: gitmanager-${{ github.ref_name }}-windows-gnu
          path: ./dist

      - name: Rename for release
        run: |
          ls -lh ./dist/
          cp ./dist/gitmanager.exe ./gitmanager-${{ github.ref_name }}-windows-gnu.exe
          ls -lh ./gitmanager-*.exe

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./gitmanager-${{ github.ref_name }}-windows-gnu.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Optional: build via Docker (ensures parity with local scripts)
  build-docker:
    name: Build via Docker (smoke test)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Build in Docker
        run: |
          docker compose build
          docker compose run --rm dev cargo test
