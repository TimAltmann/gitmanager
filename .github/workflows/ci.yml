name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Tests
        run: cargo test --verbose

  build-windows-gnu:
    name: Build Windows EXE (GNU)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      - name: Install mingw + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 clang pkg-config libssl-dev
          sudo ln -sf /usr/bin/x86_64-w64-mingw32-windres /usr/bin/windres
          windres --version
          x86_64-w64-mingw32-gcc --version

      - name: Sync version from tag
        # Stellt sicher, dass die EXE intern (CARGO_PKG_VERSION) exakt die Tag-Version
        # enthält, sonst meldet der Update-Check nie ein Update (Tag != Binary-Version).
        # Nur bei Tag-Builds (v*); Branch/PR-Builds nutzen Cargo.toml unverändert.
        # VOR rust-cache: Cache-Key enthält Cargo.lock-Hash, der nach Sync neu geschrieben wird.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag: $GITHUB_REF_NAME -> Cargo version: $TAG_VERSION"
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME ist kein gültiges Semver (erwartet vX.Y.Z)"
            exit 1
          fi
          # Nur version-Zeile innerhalb [package] patchen (nicht erste
          # version-Zeile der Datei: ein [workspace]-Eintrag oder Kommentar
          # davor würde sonst still die falsche Zeile treffen).
          awk -v ver="$TAG_VERSION" '
            /^\[package\]/{in_pkg=1; print; next}
            /^\[/{in_pkg=0}
            in_pkg && /^version = "/ && !done{sub(/^version = ".*"/, "version = \"" ver "\""); done=1}
            {print}' Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml
          COUNT=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version = "'"$TAG_VERSION"'"$/{c++} END{print c+0}' Cargo.toml)
          [ "$COUNT" = "1" ] || { echo "::error::Versionssync hat nicht genau 1 [package]-version gesetzt (count=$COUNT)"; exit 1; }
          echo "Cargo.toml nach Sync:"
          awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version = /' Cargo.toml
          grep -A2 '^\[package\]' Cargo.toml | head -5

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release (Windows GNU)
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Verify embedded version
        shell: bash
        run: |
          echo "Cargo.toml ([package]):"
          awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version = /' Cargo.toml
          echo "Cargo.lock (gitmanager-Eintrag):"
          grep -A2 'name = "gitmanager"' Cargo.lock | head -5 || true
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "Erwarte Binary-Version: $TAG_VERSION"
            awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version = /' Cargo.toml | grep -q "^version = \"$TAG_VERSION\"$" || { echo "::error::Cargo.toml [package] version != Tag $TAG_VERSION"; exit 1; }
            grep -A2 'name = "gitmanager"' Cargo.lock | grep -q "version = \"$TAG_VERSION\"" || { echo "::error::Cargo.lock gitmanager version != Tag $TAG_VERSION (Build hat Lock nicht aktualisiert?)"; exit 1; }
            echo "Version-Sync OK: $TAG_VERSION"
          else
            echo "Kein Tag-Build, keine Assertion."
          fi

      - name: Show artifact
        run: |
          ls -lh target/x86_64-pc-windows-gnu/release/gitmanager.exe || ls -lh target/x86_64-pc-windows-gnu/release/
          file target/x86_64-pc-windows-gnu/release/gitmanager.exe || true

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: gitmanager-windows-gnu-${{ github.sha }}
          path: target/x86_64-pc-windows-gnu/release/gitmanager.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload artifact (alias for release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: gitmanager-${{ github.ref_name }}-windows-gnu
          path: target/x86_64-pc-windows-gnu/release/gitmanager.exe
          retention-days: 90

  release:
    name: Publish to GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows-gnu
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download EXE artifact
        uses: actions/download-artifact@v8
        with:
          name: gitmanager-${{ github.ref_name }}-windows-gnu
          path: ./dist

      - name: Rename for release
        run: |
          ls -lh ./dist/
          cp ./dist/gitmanager.exe ./gitmanager-${{ github.ref_name }}-windows-gnu.exe
          ls -lh ./gitmanager-*.exe

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./gitmanager-${{ github.ref_name }}-windows-gnu.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Optional: build via Docker (ensures parity with local scripts)
  build-docker:
    name: Build via Docker (smoke test)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Build in Docker
        run: |
          docker compose build
          docker compose run --rm dev cargo test
